# orb box configuration (schema / example).
#
# orb is reusable tooling to stand up an agent-workstation VM. This file documents the
# schema with neutral placeholders and is the only config shipped in the public repo; the
# real, filled-in config for a given box lives privately (e.g. in a dotfiles/appa repo).
# setup.sh reads it via lib/config.py (system python3 + stdlib tomllib).
#
# Secrets NEVER go here — they are read from SSM Parameter Store at runtime. This file holds
# only non-secret, per-box values.

[box]
user       = "ubuntu"            # single login/run user; owns the volume + tools. REQUIRED.
data_mount = "/mnt/data"         # durable volume mount; all heavy trees live here. REQUIRED.
region     = "eu-west-1"         # AWS region for SSM reads. REQUIRED.
ssm_prefix = "/your-project/vm"  # SSM Parameter Store subtree holding this box's secrets.
timezone   = "Europe/London"
ssh_host   = "orb-vm"            # optional: SSH host the Mac-side scripts (push-to-vm, vm-sync) use
                                 # when --host is not given. Default "orb-vm".

[git]
name  = "Your Name"              # git identity for clone/commit on the box.
email = "you@example.com"

[agents]
configure         = "both"                # "claude" | "pi" | "both" — which agents to configure.
replicate_dev_env = true                  # replicate the agent config (skills/commands/settings) onto the box.
repo              = "your-agent-repo"      # the [[repos]] name holding the agent config (skills/commands/extensions).

[tools]
plannotator = true               # install the plannotator CLI.
extra_clis  = []                 # additional CLIs to install, e.g. ["jiracli", "jot-cli"].

# Repos to place on the box. `source` is "clone" (default) or "rsync" (explicit opt-in for
# repos the box cannot clone — no credential, or local-only; those are delivered Mac-side by
# push-to-vm.sh, which keeps .git so the box can spin worktrees, honors the repo's .gitignore, and
# excludes .worktrees). `dest` is relative to data_mount.

[[repos]]
name    = "your-agent-repo"
source  = "clone"
url     = "https://github.com/YOUR_USER/YOUR_REPO"
branch  = "main"
dest    = "dev/your-agent-repo"
uv_sync = true                   # run `uv sync` after placing.

[[repos]]
name            = "your-cli"
source          = "rsync"        # rsynced from the Mac (private host, no box credential).
rsync_path      = "~/dev/your-cli"
dest            = "dev/your-cli"
uv_tool_install = true           # install via `uv tool install --editable <dest>`.
# include: optional. Gitignored files to force-INTO the rsync anyway (push-to-vm applies these
# before the .gitignore filter). Use for local files the repo needs to run that a clone would miss.
# include = [".env", "docs/", "docs/HANDOFF.md"]   # ".../***" pulls a whole dir; a nested file
                                                    # under a gitignored dir needs the dir too.
